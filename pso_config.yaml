project: AI-Based Urban Open Space Distribution Analysis and Green Infrastructure
  Optimization
algorithm: Particle Swarm Optimization
variant: Discrete PSO with Integer Repair
dataset: C:\Users\sagni\Downloads\AI-Based Urban Open Space Distribution Analysis
  and Green Infrastructure Optimization Using PSO and AIS\OpenSpaces_Jalandhar_2.csv
objective: Minimize variance of final counts
budget: 100
